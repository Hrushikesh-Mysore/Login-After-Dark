<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>

    <!-- Cyber Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Moon Gradient -->
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Shield Face Gradient -->
    <linearGradient id="shieldFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Keyhole Core Glow -->
    <linearGradient id="keyholeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Ambient Radial Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Filter Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6"/>
  
  <!-- Subtle Circuit Border Inset -->
  <rect x="30" y="30" width="452" height="452" rx="98" fill="none" stroke="#06b6d4" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="12 8"/>

  <!-- Ambient Light Aura -->
  <circle cx="256" cy="256" r="170" fill="url(#coreGlow)"/>

  <!-- Circuit Trace Accents -->
  <g stroke="#06b6d4" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M 70 256 L 110 256 L 130 276"/>
    <circle cx="70" cy="256" r="4" fill="#06b6d4" fill-opacity="0.6"/>
    <path d="M 442 256 L 402 256 L 382 236"/>
    <circle cx="442" cy="256" r="4" fill="#8b5cf6" fill-opacity="0.6"/>
    <path d="M 256 66 L 256 96"/>
    <circle cx="256" cy="66" r="4" fill="#38bdf8" fill-opacity="0.6"/>
  </g>

  <!-- Security Shield Main Body -->
  <path d="M 256 94 
           C 330 94, 386 114, 396 142 
           C 396 244, 350 354, 256 422 
           C 162 354, 116 244, 116 142 
           C 126 114, 182 94, 256 94 Z" 
        fill="url(#shieldFace)" 
        stroke="url(#borderGrad)" 
        stroke-width="7" 
        stroke-linejoin="round"/>

  <!-- Inner Shield Trim Line -->
  <path d="M 256 114 
           C 318 114, 366 130, 374 154 
           C 374 238, 336 332, 256 392 
           C 176 332, 138 238, 138 154 
           C 146 130, 194 114, 256 114 Z" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-opacity="0.3" 
        stroke-width="2"/>

  <!-- Crescent Moon (After Dark Symbol) Embracing Left Center -->
  <path d="M 248 140
           C 186 148, 142 200, 148 266
           C 154 328, 206 376, 270 372
           C 240 354, 222 320, 222 280
           C 222 230, 252 188, 296 170
           C 281 149, 265 142, 248 140 Z"
        fill="url(#moonGrad)"
        filter="url(#neonGlow)"/>

  <!-- Moon Highlight Ring Arc -->
  <path d="M 228 152
           C 172 164, 154 216, 160 274
           C 166 324, 204 360, 254 362"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.6"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Keyhole Core / Authentication Emblem -->
  <!-- Keyhole Top Head -->
  <circle cx="276" cy="248" r="26" fill="url(#keyholeGrad)" filter="url(#neonGlow)"/>
  <circle cx="276" cy="248" r="16" fill="#080e1a"/>

  <!-- Keyhole Stem -->
  <polygon points="268,258 284,258 290,296 262,296" fill="url(#keyholeGrad)" filter="url(#neonGlow)"/>

  <!-- Keyhole Core Aperture Glow Dot -->
  <circle cx="276" cy="248" r="8" fill="#38bdf8"/>
  <circle cx="276" cy="248" r="3" fill="#ffffff"/>

  <!-- Cyber Digital Spark Stars (Night Sky Elements) -->
  <!-- Top Right Spark -->
  <path d="M 388 90 Q 388 106, 404 106 Q 388 106, 388 122 Q 388 106, 372 106 Q 388 106, 388 90 Z" fill="#38bdf8"/>
  <!-- Top Left Spark -->
  <path d="M 124 104 Q 124 116, 136 116 Q 124 116, 124 128 Q 124 116, 112 116 Q 124 116, 124 104 Z" fill="#818cf8"/>
  <!-- Bottom Right Spark -->
  <path d="M 370 380 Q 370 390, 380 390 Q 370 390, 370 400 Q 370 390, 360 390 Q 370 390, 370 380 Z" fill="#c084fc"/>

  <!-- Horizontal Scanline Texture Hint -->
  <line x1="150" y1="256" x2="362" y2="256" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 6"/>
</svg>